name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_ENV: ci
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Toolchain and tool versions (rust, mbx, nextest, uv) come from mise.toml,
# pinned by mise.lock. mise-action runs before mr-boxington-action so the
# cache key sees the pinned rustc, and the cache action reuses the mbx that
# mise put on PATH. mise-action caches mise's data directory (the mise
# binary and every tool) per runner image and config hash, so a warm job
# downloads nothing; MISE_ENV=ci loads mise.ci.toml, which moves rustup's
# toolchains into that directory. Jobs whose tool set differs (msrv, fuzz)
# get their own cache_key_prefix: jobs sharing a key would save whichever
# set finished first. Both actions authenticate their GitHub downloads with
# the job's token by default (mise-action exports it as MISE_GITHUB_TOKEN
# for later mise calls), so they are not rate limited.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path python/Cargo.toml
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, runner: ubuntu-latest }
          # The darwin-only Metal backend (`--features metal`) and the
          # aarch64 SIMD kernels are only compiled on this runner.
          - { name: aarch64-darwin, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: clippy-${{ matrix.name }}
      # Lint levels (pedantic) live in Cargo.toml's [lints] table.
      - run: mbx clippy --all-targets --all-features -- -D warnings
      - run: mbx clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, runner: ubuntu-26.04 }
          - { name: aarch64-linux, runner: ubuntu-26.04-arm }
          - { name: aarch64-darwin, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-ci
      # NVRTC alone (no driver, no GPU): `tests/cuda.rs` then compiles the
      # CUDA kernels for every target architecture, while the tests that
      # need a device skip. The wheel ships only `libnvrtc.so.13`, so link
      # the `libnvrtc.so` name the loader looks for.
      - name: Install NVRTC
        if: runner.os == 'Linux'
        run: |
          uv pip install --quiet --target "$RUNNER_TEMP/nvrtc" nvidia-cuda-nvrtc==13.4.92
          so=$(find "$RUNNER_TEMP/nvrtc" -name 'libnvrtc.so.[0-9]*' ! -name '*builtins*' | head -1)
          ln -sf "$so" "$(dirname "$so")/libnvrtc.so"
          echo "LD_LIBRARY_PATH=$(dirname "$so")" >> "$GITHUB_ENV"
      # The `ci` Cargo profile (Cargo.toml): opt-level 1 with debug
      # assertions, about ten times faster than `dev` for this suite.
      # nextest's own `--profile` would pick a nextest profile.
      - run: mbx nextest run --cargo-profile ci --all-features
      # nextest does not run doctests.
      - run: mbx test --doc --profile ci --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: docs
      - run: mbx doc --no-deps --all-features

  msrv:
    name: MSRV (1.93.0)
    runs-on: ubuntu-latest
    env:
      # Overrides the rust version from mise.toml for every mise step.
      MISE_RUST_VERSION: 1.93.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          # Different tools from the other jobs' (same config files).
          cache_key_prefix: mise-v1-msrv
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: msrv
      - run: mbx build --all-features

  parity:
    name: XGBoost and LightGBM parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: parity
      # uv's cache keeps the XGBoost wheel it builds from the source tarball
      # (over three minutes with CMake). `uv cache prune --ci` below drops
      # what uv can download again, so the saved cache is mostly that wheel.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-*.txt') }}
          restore-keys: uv-parity-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate fixtures from XGBoost 3.4.2
        run: uv run --with-requirements scripts/requirements-xgboost.txt python scripts/gen_fixtures.py
      - name: Generate LightGBM import fixtures from LightGBM 4.7.0
        run: uv run --with-requirements scripts/requirements-lightgbm.txt python scripts/gen_lightgbm_fixtures.py
      # One invocation builds both test binaries in one release build.
      - name: Train, import and cut parity; LightGBM import parity
        run: mbx nextest run --test parity --test lightgbm_parity --release --run-ignored only --no-capture
      - name: Export parity (reload in XGBoost)
        run: uv run --with-requirements scripts/requirements-xgboost.txt python scripts/check_exports.py
      - run: uv cache prune --ci

  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: semver
      # Compares the public API against the latest crates.io release; fails
      # when Cargo.toml's version is too small a bump for the changes.
      - run: mbx semver-checks --verbose

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    env:
      # mr-boxington-action caches the root `target/`; build there so the
      # warm target tree also covers the sanitizer compiles mbx bypasses.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # fuzz/mise.toml layers nightly Rust and cargo-fuzz over mise.toml;
      # `mise exec` there selects them and routes cargo through mbx.
      - uses: jdx/mise-action@v4
        with:
          cache_key_prefix: mise-v1-fuzz
          working_directory: fuzz
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: fuzz
      - name: Run each fuzz target for 10 seconds
        working-directory: fuzz
        run: mise exec -- ./run.sh 10
      - name: Print crashing inputs
        if: failure()
        working-directory: fuzz
        run: |
          for input in artifacts/*/*; do
            [ -f "$input" ] || continue
            echo "== $input"
            base64 -w0 "$input"
            echo
          done

  # One abi3 wheel per platform, tested on the newest and oldest supported
  # CPython, plus the free-threaded wheel on Linux: the wheels publish.yml
  # builds, through the same test-wheel.sh.
  python:
    name: Python / ${{ matrix.os }} / ${{ matrix.wheel }}
    runs-on: ${{ matrix.os }}
    env:
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-latest
          - windows-latest
        wheel: [abi3]
        include:
          - os: ubuntu-26.04
            wheel: free-threaded
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: python
      - name: Install free-threaded Python
        if: matrix.wheel == 'free-threaded'
        id: ft-python
        run: |
          uv python install 3.14t
          echo "path=$(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
      # Without the release profile's LTO and single codegen unit, which
      # change neither behavior nor results but serialize the build (over
      # a minute of it). python-sdist and publish.yml build with them.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        with:
          command: build
          manylinux: ${{ matrix.wheel == 'free-threaded' && 'off' || '' }}
          args: --release --locked --out dist ${{ matrix.wheel == 'free-threaded' && format('-i {0}', steps.ft-python.outputs.path) || '' }}
          working-directory: python
      # Latest Python first: "3" matches any installed 3.x, so it must run
      # before 3.11 is installed to fetch the newest one.
      - name: Test abi3 wheel on latest Python
        if: matrix.wheel == 'abi3'
        run: sh ../.github/scripts/test-wheel.sh 3 'dist/*cp311-abi3*.whl'
        working-directory: python
      # In the latest-Python environment the step above left, with the wheel
      # installed.
      - name: Check public types
        if: matrix.os == 'ubuntu-26.04' && matrix.wheel == 'abi3'
        run: uv run --no-sync pyright --verifytypes hessboost --ignoreexternal
        working-directory: python
      # Editors show these docstrings on hover; pyright counts the public
      # functions and classes without one but does not fail on them.
      - name: Check public docstrings
        if: matrix.os == 'ubuntu-26.04' && matrix.wheel == 'abi3'
        run: |
          uv run --no-sync pyright --verifytypes hessboost --ignoreexternal --outputjson |
            uv run --no-sync python -c '
          import json, sys
          report = json.load(sys.stdin)["typeCompleteness"]
          missing = report["missingFunctionDocStringCount"] + report["missingClassDocStringCount"]
          undocumented = [s["name"] for s in report["symbols"] for d in s["diagnostics"] if "docstring" in d["message"]]
          sys.exit(f"{missing} public symbols without a docstring: {undocumented}" if missing else 0)
          '
        working-directory: python
      - name: Test abi3 wheel on Python 3.11
        if: matrix.wheel == 'abi3'
        run: sh ../.github/scripts/test-wheel.sh 3.11 'dist/*cp311-abi3*.whl'
        working-directory: python
      - name: Test free-threaded wheel
        if: matrix.wheel == 'free-threaded'
        run: sh ../.github/scripts/test-wheel.sh 3.14t 'dist/*cp314-cp314t*.whl'
        working-directory: python

  python-lint:
    name: Python lint (ruff, ty)
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          working-directory: python
      # The lint group without the project: ty reads the extension's stub,
      # so nothing is compiled. ruff.toml and ty.toml at the root cover
      # python/, scripts/, release.py, and Markdown snippets.
      - name: Install lint dependencies
        run: uv sync --locked --only-group lint
        working-directory: python
      - run: uv run --project python --no-sync ruff check --output-format github
      - run: uv run --project python --no-sync ruff format --check
      - run: uv run --project python --no-sync ty check --output-format github

  python-sdist:
    name: Python sdist round-trip
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          working-directory: python
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - name: Build wheel from source distribution
        run: |
          mkdir extracted
          tar -xzf python/dist/*.tar.gz -C extracted
          sdist_dir=(extracted/*)
          mv "${sdist_dir[0]}" extracted/sdist
          cd extracted/sdist
          uvx --from 'maturin>=1.15,<2' maturin build --release --locked --out "$GITHUB_WORKSPACE/python/dist"
      # The source distribution carries no uv.lock, so resolve the test group afresh.
      - name: Install test dependencies from extracted project
        run: uv sync --only-group test
        working-directory: extracted/sdist
      - name: Install built wheel
        run: uv pip install "$GITHUB_WORKSPACE"/python/dist/*.whl
        working-directory: extracted/sdist
      - name: Verify installed wheel import
        run: uv run --no-sync python -c "import hessboost; assert 'site-packages' in hessboost.__file__, hessboost.__file__"
        working-directory: extracted/sdist
      - name: Run tests from extracted source distribution
        run: uv run --no-sync pytest -p no:cacheprovider python/tests
        working-directory: extracted/sdist

  all-checks-passed:
    permissions: {}
    needs: [fmt, clippy, test, docs, msrv, parity, semver, fuzz, python, python-lint, python-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on upstream failure too (so branch protection sees a failure), but
    # not on cancellation.
    if: ${{ !cancelled() }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All checks passed"
